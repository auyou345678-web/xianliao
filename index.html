<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>线聊官方下载</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f6f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 40px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            text-align: center;
        }
        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-align(135deg, #3b82f6, #1d4ed8);
            background: #2563eb;
            color: #ffffff;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin-bottom: 18px;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }
        h2 { font-size: 22px; color: #111827; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { font-size: 13px; color: #6b7280; margin-bottom: 32px; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.98); }
        .btn-ios {
            background-color: #111827;
            color: #ffffff;
        }
        .btn-android {
            background-color: #10b981;
            color: #ffffff;
        }
        .btn span { margin-right: 8px; font-size: 18px; }
        .tip { font-size: 12px; color: #9ca3af; margin-top: 18px; line-height: 1.5; }
        
        /* 微信提示遮罩 */
        #weixin-tip {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            color: #fff;
            padding: 30px 20px;
            text-align: right;
        }
        #weixin-tip p {
            font-size: 16px;
            line-height: 1.6;
            margin-top: 10px;
            text-align: right;
            padding-right: 20px;
        }
    </style>
</head>
<body>
    <!-- 微信内打开提示 -->
    <div id="weixin-tip" onclick="this.style.display='none'">
        <div style="font-size: 36px; padding-right: 10px;">↗</div>
        <p>微信内无法直接下载<br>请点击右上角 <strong>•••</strong><br>选择 <strong>在浏览器打开</strong></p>
    </div>

    <div class="card">
        <div class="logo-box">💬</div>
        <h2>线聊 官方下载</h2>
        <p class="subtitle">请选择您手机对应的系统版本</p>

        <!-- 真实苹果与安卓下载链接 -->
        <a href="https://qpycb3i.modeldesign-gym.com/d/2q7evhk4109vgjt" class="btn btn-ios">
            <span>🍎</span> 苹果版下载 (iOS)
        </a>
        <a href="https://d1c8efey06xw0o.cloudfront.net/xianliao.apk" class="btn btn-android">
            <span>🤖</span> 安卓版直接下载 (APK)
        </a>

        <div class="tip">如遇微信拦截，请点击右上角在浏览器中打开下载</div>
    </div>

    <script>
        // 检测是否在微信内打开
        function isWeixin() {
            var ua = navigator.userAgent.toLowerCase();
            return ua.indexOf('micromessenger') !== -1;
        }
        if (isWeixin()) {
            document.getElementById('weixin-tip').style.display = 'block';
        }
    </script>
</body>
</html>
