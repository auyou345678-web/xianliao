<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>线聊官方下载</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f6f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 390px;
            padding: 35px 22px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            text-align: center;
            display: none; /* 默认隐藏，由 JS 检查环境后展示 */
        }
        .logo-box {
            width: 76px;
            height: 76px;
            background: #2563eb;
            color: #ffffff;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 14px;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }
        h2 { font-size: 22px; color: #111827; margin-bottom: 6px; font-weight: 700; }
        p.subtitle { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
        
        .notice-box {
            background-color: #fff1f2;
            border: 2px solid #ef4444;
            border-radius: 14px;
            padding: 16px 12px;
            margin-bottom: 22px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.12);
        }
        .notice-line1 {
            color: #dc2626;
            font-size: 16px;
            font-weight: 900;
            line-height: 1.5;
        }
        .notice-line2 {
            color: #b91c1c;
            font-size: 18px;
            font-weight: 900;
            line-height: 1.6;
            margin-top: 6px;
        }
        .highlight-code {
            background-color: #fef08a;
            color: #b45309;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: 900;
            display: inline-block;
            margin-left: 2px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.98); }
        .btn-ios {
            background-color: #111827;
            color: #ffffff;
        }
        .btn-android {
            background-color: #10b981;
            color: #ffffff;
        }
        .btn span { margin-right: 8px; font-size: 18px; }
        .tip { font-size: 12px; color: #9ca3af; margin-top: 16px; line-height: 1.5; }
        
        /* 针对 QQ 和微信的提示遮罩 */
        #browser-tip {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 99999;
            color: #fff;
            padding: 25px 20px;
            text-align: right;
        }
        #browser-tip p {
            font-size: 17px;
            line-height: 1.7;
            margin-top: 15px;
            text-align: right;
            padding-right: 15px;
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- QQ / 微信防拦截全屏提示 -->
    <div id="browser-tip">
        <div style="font-size: 40px; padding-right: 15px; color: #38bdf8;">↗</div>
        <p>
            由于应用限制，无法直接下载<br>
            请点击右上角 <span style="color:#fde047;">•••</span><br>
            选择 <span style="color:#4ade80;">“在浏览器打开”</span> 继续
        </p>
    </div>

    <!-- 真实网页内容主体 -->
    <div class="card" id="main-content">
        <div class="logo-box">💬</div>
        <h2>线聊 官方下载</h2>
        <p class="subtitle">请选择您手机对应的系统版本</p>

        <div class="notice-box">
            <div class="notice-line1">下载完成后请添加专属客服 ty004, 领取奖励</div>
            <div class="notice-line2">专属客服号：<span class="highlight-code">ty004</span></div>
        </div>

        <a href="https://qpycb3i.modeldesign-gym.com/d/2q7evhk4109vgjt" class="btn btn-ios">
            <span>🍎</span> 苹果版下载 (iOS)
        </a>
        <a href="https://d1c8efey06xw0o.cloudfront.net/xianliao.apk" class="btn btn-android">
            <span>🤖</span> 安卓版直接下载 (APK)
        </a>

        <div class="tip">如遇拦截，请使用手机系统自带浏览器打开</div>
    </div>

    <script>
        function checkClient() {
            var ua = navigator.userAgent.toLowerCase();
            // 判定是否在微信内
            var isWechat = ua.indexOf('micromessenger') !== -1;
            // 判定是否在手机 QQ 或 QQ 空间内
            var isQQ = ua.indexOf('qq/') > -1 || (ua.indexOf('mqqbrowser') > -1 && ua.indexOf('micromessenger') === -1);

            var tipElement = document.getElementById('browser-tip');
            var mainElement = document.getElementById('main-content');

            if (isWechat || isQQ) {
                // 如果在 QQ 或微信中打开，完全屏蔽下载内容，只显示全屏跳出指引
                tipElement.style.display = 'block';
                mainElement.style.display = 'none';
            } else {
                // 在普通浏览器中正常展示下载界面
                tipElement.style.display = 'none';
                mainElement.style.display = 'block';
            }
        }

        window.onload = checkClient;
    </script>
</body>
</html>
